@if (auth.authenticated()) {
  <header class="authenticated-header">
    <div class="authenticated-header__content">
      <div>
        <strong class="brand-name">NETEC</strong>
        <span>Portal de Registro de Exámenes</span>
      </div>
      @if (auth.identity(); as person) {
        <app-authenticated-user-menu
          [name]="person.name"
          [username]="person.username"
          [loggingOut]="auth.state() === 'LOGGING_OUT'"
          (logoutRequested)="requestLogout()" />
      }
    </div>
  </header>
}

@if (confirmLogout()) {
  <div class="confirmation-backdrop">
    <section class="confirmation-panel" role="dialog" aria-modal="true" aria-labelledby="logout-title">
      <h2 id="logout-title">¿Cerrar sesión?</h2>
      <p>Tienes cambios sin guardar. Los borradores persistidos permanecerán disponibles.</p>
      <div class="confirmation-actions">
        <button mat-button type="button" (click)="confirmLogout.set(false)">Continuar editando</button>
        <button mat-flat-button type="button" (click)="logout()">Cerrar sesión</button>
      </div>
    </section>
  </div>
}

<router-outlet />
