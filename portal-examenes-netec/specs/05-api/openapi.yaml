openapi: 3.1.0
info: {title: Portal de Registro de Exámenes NETEC API, version: 0.2.0-spec}
servers:
  - url: /api/v1
    description: Ruta relativa same-origin; NGINX conserva `/api` al reenviar.
security: [{bearerAuth: []}]
x-notification-stage-a:
  status: PROPOSED
  submit: Persiste solicitud y Outbox; responde PENDIENTE_NOTIFICACION sin afirmar entrega Graph.
  sender: POST /v1.0/users/{senderMailbox}/sendMail mediante adaptador backend app-only.
  idempotencyKey: approval-exam-request:{requestId}:v{submissionVersion}
  cc: Testing Center solo para codigos expresamente aprobados; P-39 bloquea inferir LATAM.
  outOfScope: Aprobacion/rechazo dentro del portal, compra, vouchers y Graph desde frontend.
paths:
  /auth/me:
    get:
      servers:
        - {url: /api, description: Contrato propuesto de identidad fuera del versionado de recursos}
      operationId: getAuthenticatedIdentity
      summary: Devuelve identidad mínima validada del principal autenticado.
      description: Endpoint definitivo de identidad. Sustituye coordinadamente `/api/v1/me`. No devuelve tokens, secretos ni claims innecesarios.
      security:
        - entraOAuth2: [ExamRequests.Access]
      responses:
        '200':
          description: Identidad válida
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticatedIdentity'}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /exam-requests:
    post:
      operationId: createDraft
      summary: Crea borrador propio; requester y datos derivados se ignoran si llegan del cliente.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ExamRequestInput'}
      responses: {'201': {$ref: '#/components/responses/ExamRequest'}, '400': {$ref: '#/components/responses/Problem'}}
    get:
      operationId: listOwnRequests
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: folio, in: query, schema: {type: string}}
        - {name: participant, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/Status'}}
        - {name: technologyId, in: query, schema: {type: string, format: uuid}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses: {'200': {$ref: '#/components/responses/Page'}, '400': {$ref: '#/components/responses/Problem'}}
  /exam-requests/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getOwnRequest
      responses: {'200': {$ref: '#/components/responses/ExamRequest'}, '404': {$ref: '#/components/responses/Problem'}}
    put:
      operationId: updateDraft
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/ExamRequestInput'}
      responses: {'200': {$ref: '#/components/responses/ExamRequest'}, '409': {$ref: '#/components/responses/Problem'}}
  /exam-requests/{id}/validate:
    post:
      operationId: validateDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Válido; incluye total recalculado}, '400': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /exam-requests/{id}/submit:
    post:
      operationId: submitDraft
      description: Requiere Idempotency-Key e If-Match. Re-resuelve precio y aprobador vigente por sede, ignora cualquier destinatario cliente, recalcula total, congela snapshots y crea outbox. Si el aprobador cambió desde la confirmación devuelve 409 para nueva revisión.
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {$ref: '#/components/responses/ExamRequest'}, '400': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /exam-requests/{id}/cancel:
    post:
      operationId: cancelDraft
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {$ref: '#/components/responses/ExamRequest'}, '409': {$ref: '#/components/responses/Problem'}}
  /catalogs/course-types: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/segments: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/branches: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/technologies: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/vendors: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/certifications: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/courses: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/business-centers: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/cost-centers: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/clients: {$ref: '#/components/pathItems/Catalog'}
  /catalogs/sites: {$ref: '#/components/pathItems/Catalog'}
  /approval-routing/resolve:
    get:
      operationId: resolveApprovalRecipient
      summary: Resuelve para presentación el aprobador vigente de una sede; submit siempre repite la resolución.
      parameters:
        - {name: siteId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Aprobador sin correo expuesto, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalRoutingResolution'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /catalogs/exams:
    get:
      operationId: searchExams
      summary: Busca exámenes activos; filtros vendorId, technologyId, certificationId y q; paginado.
      responses: {'200': {$ref: '#/components/responses/CatalogPage'}}
  /catalogs/exams/{id}:
    get:
      operationId: getExam
      parameters: [{$ref: '#/components/parameters/Id'}]
      description: Devuelve detalle y precio aplicable cuando puede resolverse inequívocamente; si faltan dimensiones usa enlace al endpoint price.
      responses: {'200': {description: Examen, content: {application/json: {schema: {$ref: '#/components/schemas/ExamDetail'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /catalogs/exams/{id}/price:
    get:
      operationId: resolveExamPrice
      parameters: [{$ref: '#/components/parameters/Id'}]
      description: Endpoint separado provisional por ADR-011; acepta futuras dimensiones país/contrato sin inflar búsqueda.
      responses: {'200': {description: Precio vigente, content: {application/json: {schema: {$ref: '#/components/schemas/Money'}}}}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /exam-catalog:
    get:
      operationId: searchExamCatalog
      summary: Consulta paginada del catálogo persistido.
      parameters:
        - {name: vendor, in: query, schema: {type: string, maxLength: 120}}
        - {name: code, in: query, schema: {type: string, maxLength: 100}}
        - {name: query, in: query, schema: {type: string, maxLength: 250}}
        - {name: active, in: query, schema: {type: boolean, default: true}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Página de catálogo, content: {application/json: {schema: {$ref: '#/components/schemas/ExamCatalogPage'}}}}
  /exam-catalog/vendors:
    get:
      operationId: listExamCatalogVendors
      responses:
        '200': {description: Proveedores activos, content: {application/json: {schema: {type: array, items: {type: string}}}}}
  /exam-catalog/{id}:
    get:
      operationId: getExamCatalogItem
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Detalle público, content: {application/json: {schema: {$ref: '#/components/schemas/ExamCatalogItem'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/exams:
    post:
      operationId: createExam
      summary: Testing Center agrega examen; autorización técnica pendiente.
      responses: {'201': {description: Creado}, '403': {$ref: '#/components/responses/Problem'}}
  /admin/exams/{id}:
    put:
      operationId: updateExam
      parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/IfMatch'}]
      summary: Modifica examen, retake y comentarios con auditoría.
      responses: {'200': {description: Actualizado}, '409': {$ref: '#/components/responses/Problem'}}
  /admin/exams/{id}/prices:
    post:
      operationId: addExamPrice
      parameters: [{$ref: '#/components/parameters/Id'}]
      summary: Agrega costo base USD por proveedor/vigencia; MAD convierte con tasa administrada aparte.
      responses: {'201': {description: Precio creado}, '409': {$ref: '#/components/responses/Problem'}}
  /admin/exchange-rates/usd-eur:
    post:
      operationId: addUsdEurExchangeRate
      summary: Registra tasa USD→EUR y vigencia para conversión exclusiva de MAD.
      responses: {'201': {description: Tasa creada}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    entraOAuth2:
      type: oauth2
      description: Microsoft Entra ID; tenant/cliente se obtienen de configuración por ambiente.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/token
          scopes:
            ExamRequests.Access: Acceder al Portal de Registro de Exámenes.
  pathItems:
    Catalog:
      get:
        summary: Catálogo activo buscable y paginado con q, page y size.
        responses: {'200': {$ref: '#/components/responses/CatalogPage'}}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 16, maxLength: 128}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
  requestBodies:
    ExamRequestInput:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ExamRequestInput'}}}
  schemas:
    AuthenticatedIdentity:
      type: object
      additionalProperties: false
      required: [subject, name, username, tenantId, scopes, roles]
      properties:
        subject: {type: string, minLength: 1}
        objectId: {type: [string, 'null'], format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        username:
          type: string
          maxLength: 254
          description: UPN resuelto y validado por backend; precedencia preferred_username, upn, email. Vacío si no existe.
        tenantId: {type: string, format: uuid}
        scopes: {type: array, uniqueItems: true, items: {type: string}}
        roles: {type: array, uniqueItems: true, items: {type: string}}
        area: {type: [string, 'null'], maxLength: 120, description: Opcional en MVP hasta definir fuente}
        businessUnit: {type: [string, 'null'], maxLength: 120, description: Opcional en MVP hasta definir fuente}
    Status: {type: string, enum: [BORRADOR, REGISTRADA, PENDIENTE_NOTIFICACION, ENVIADA_A_APROBADOR, CANCELADA]}
    ParticipantInput:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email]
      properties: {id: {type: string, format: uuid}, firstName: {type: string, maxLength: 100}, lastName: {type: string, maxLength: 100}, secondLastName: {type: [string, 'null'], maxLength: 100}, email: {type: string, format: email, maxLength: 254}, company: {type: [string, 'null'], maxLength: 160}, country: {type: [string, 'null'], pattern: '^[A-Z]{2}$'}, city: {type: [string, 'null'], maxLength: 120}, externalParticipantId: {type: [string, 'null'], maxLength: 80}}
    ExamAssignmentInput:
      type: object
      additionalProperties: false
      required: [examCatalogId, participantIds]
      description: Cantidad, costos, moneda y snapshots son resueltos por backend.
      properties: {examCatalogId: {type: string, format: uuid}, participantIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}}
    ExamRequestInput:
      type: object
      additionalProperties: false
      description: No admite requester, asesor comercial, destinatario, snapshots, costos, precio de venta, moneda, quantity, lineTotal ni totalAmount. Requester y salesAdvisor se resuelven desde el principal autenticado; el backend resuelve costo base USD. `siteId` es la sede operativa y `organizationalLocationId` queda como alias deprecado.
      properties: {scheduledCourseCode: {type: [string, 'null'], maxLength: 80}, courseTypeId: {type: [string, 'null'], format: uuid}, segmentId: {type: [string, 'null'], format: uuid}, siteId: {type: [string, 'null'], format: uuid}, organizationalLocationId: {type: [string, 'null'], format: uuid, deprecated: true}, companyName: {type: [string, 'null'], minLength: 2, maxLength: 150, description: Texto libre MVP; opcional al guardar borrador y obligatorio al enviar.}, companyId: {type: [string, 'null'], format: uuid, deprecated: true, description: Sin uso en MVP.}, billingReference: {type: [string, 'null'], maxLength: 250}, participants: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ParticipantInput'}}, examAssignments: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ExamAssignmentInput'}}, observations: {type: [string, 'null'], maxLength: 2000}}
    ApprovalRoutingResolution:
      type: object
      additionalProperties: false
      required: [site, approvalRecipientName, routingRuleId, resolvedAt]
      properties:
        site: {type: object, required: [id, code, name], properties: {id: {type: string, format: uuid}, code: {type: string}, name: {type: string}}}
        approvalRecipientName: {type: string}
        routingRuleId: {type: string, format: uuid}
        resolvedAt: {type: string, format: date-time}
      description: No expone el correo del aprobador por minimización de datos.
    Money: {type: object, required: [amount, currency], properties: {amount: {type: number, format: decimal, minimum: 0, multipleOf: 0.0001}, currency: {type: string, pattern: '^[A-Z]{3}$'}, sourceAmount: {type: [number, 'null'], format: decimal}, sourceCurrency: {type: [string, 'null'], pattern: '^[A-Z]{3}$'}, exchangeRate: {type: [number, 'null'], format: decimal}, exchangeRateDate: {type: [string, 'null'], format: date-time}, validFrom: {type: [string, 'null'], format: date}, validTo: {type: [string, 'null'], format: date}}}
    ExamCatalogItem:
      type: object
      additionalProperties: false
      required: [id, vendor, courseName, examCode, examName, baseCost, baseCurrency, active]
      properties:
        id: {type: string, format: uuid}
        vendor: {type: string}
        courseName: {type: string}
        examCode: {type: string}
        examName: {type: string}
        retake: {type: [string, 'null']}
        baseCost: {type: number, format: decimal, minimum: 0, multipleOf: 0.0001}
        baseCurrency: {type: string, const: USD}
        comments: {type: [string, 'null']}
        active: {type: boolean}
    ExamCatalogPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/ExamCatalogItem'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    ExamDetail: {type: object, required: [id, code, name, vendor, technology, active], properties: {id: {type: string, format: uuid}, code: {type: string}, name: {type: string}, vendor: {type: object}, technology: {type: object}, certification: {type: [object, 'null']}, active: {type: boolean}, price: {anyOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}}}
    RequesterSnapshot: {type: object, readOnly: true, required: [id, name, email], properties: {id: {type: string}, name: {type: string}, email: {type: string, format: email}, area: {type: [string, 'null']}, businessUnit: {type: [string, 'null']}}}
    SalesAdvisorSnapshot: {type: object, readOnly: true, required: [id, name, userPrincipalName], properties: {id: {type: string}, name: {type: string}, userPrincipalName: {type: string, format: email}}}
    ExamRequest: {allOf: [{$ref: '#/components/schemas/ExamRequestInput'}, {type: object, required: [id, status, requester, salesAdvisor, createdAt, version], properties: {id: {type: string, format: uuid}, folio: {type: [string, 'null']}, status: {$ref: '#/components/schemas/Status'}, requester: {$ref: '#/components/schemas/RequesterSnapshot'}, salesAdvisor: {$ref: '#/components/schemas/SalesAdvisorSnapshot'}, companyNameSnapshot: {type: [string, 'null'], maxLength: 150}, site: {type: [object, 'null']}, approvalRecipientName: {type: [string, 'null']}, approvalNotificationStatus: {type: [string, 'null'], enum: [PENDING, SENT, FAILED, DEAD_LETTER, null]}, itemSnapshots: {type: array, items: {type: object}}, totalAmount: {anyOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}, createdAt: {type: string, format: date-time}, submittedAt: {type: [string, 'null'], format: date-time}, version: {type: integer}}}]}
    Problem: {type: object, required: [type, title, status, code, timestamp, correlationId], properties: {type: {type: string, format: uri}, title: {type: string}, status: {type: integer}, detail: {type: string}, instance: {type: string}, code: {type: string}, timestamp: {type: string, format: date-time}, correlationId: {type: string}, fieldErrors: {type: array, items: {type: object}}}}
  responses:
    ExamRequest: {description: Solicitud propia, content: {application/json: {schema: {$ref: '#/components/schemas/ExamRequest'}}}}
    Page: {description: Página propia ordenada por fecha descendente, content: {application/json: {schema: {type: object}}}}
    CatalogPage: {description: "Página de elementos activos con id, code y name", content: {application/json: {schema: {type: object}}}}
    Problem: {description: Problem Details, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
